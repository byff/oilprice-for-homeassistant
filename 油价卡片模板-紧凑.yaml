# 油价紧凑卡片（样式参考“最新油价”卡片，适配本插件的实体结构）
#
# 用法：
#   1. 把下方所有实体 ID 里的 bei_jing 换成你要的地区 slug
#      （北京 bei_jing / 上海 shang_hai / 广东 yan_dong / 陕西 shaan_xi …）
#   2. 在仪表盘编辑界面选择“Markdown”卡片，粘贴本文件内容
#
# 依赖实体（以北京为例）：
#   sensor.you_jie_bei_jing_friendly_name   地区名称
#   sensor.you_jie_bei_jing_update_time     更新时间
#   sensor.you_jie_bei_jing_gas92/95/98      汽油价格
#   sensor.you_jie_bei_jing_die0             0# 柴油价格
#   sensor.you_jie_bei_jing_next_adjust_date 下次调价日期
#   sensor.you_jie_bei_jing_time             下次调价时间原文
#   sensor.you_jie_bei_jing_tips             调价幅度（经过9个工作日统计，油价下调535元/吨，即油价下跌0.41-0.48元/升）
#   sensor.you_jie_bei_jing_trend            涨跌趋势（上调/下调/搁浅）
type: markdown
content: |-
  {%- set region = states('sensor.you_jie_bei_jing_friendly_name') -%}
  {%- set next_date = states('sensor.you_jie_bei_jing_next_adjust_date') or states('sensor.you_jie_bei_jing_time') -%}
  {%- set tips = states('sensor.you_jie_bei_jing_tips') -%}
  {%- set trend = states('sensor.you_jie_bei_jing_trend') -%}
  <div style="background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;">
  <div style="display:flex;align-items:center;justify-content:space-between;color:rgba(255,255,255,0.75);font-size:13px;">
  <span style="display:inline-flex;align-items:center;gap:6px;"><ha-icon icon="mdi:history" style="font-size:15px;"></ha-icon>{{ states.sensor.you_jie_bei_jing_update_time.last_changed.strftime('%Y-%m-%d') }}</span>
  <span style="font-size:12px;color:rgba(255,255,255,0.55);">{{ region or '油价' }}</span>
  </div>
  <div style="margin:12px 0 10px;text-align:center;font-size:22px;font-weight:700;line-height:2;">
  <div><span style="color:#ffffff;">92#</span> <ha-icon icon="mdi:gas-station" style="font-size:15px;color:rgba(255,255,255,0.8);"></ha-icon> <span style="color:#ea4335;">{{ states('sensor.you_jie_bei_jing_gas92') or '-' }}</span><span style="display:inline-block;width:26px;"></span><span style="color:#ffffff;">95#</span> <ha-icon icon="mdi:gas-station" style="font-size:15px;color:rgba(255,255,255,0.8);"></ha-icon> <span style="color:#fbbc05;">{{ states('sensor.you_jie_bei_jing_gas95') or '-' }}</span></div>
  <div><span style="color:#ffffff;">98#</span> <ha-icon icon="mdi:gas-station" style="font-size:15px;color:rgba(255,255,255,0.8);"></ha-icon> <span style="color:#4285f4;">{{ states('sensor.you_jie_bei_jing_gas98') or '-' }}</span><span style="display:inline-block;width:26px;"></span><span style="color:#ffffff;">0#柴</span> <ha-icon icon="mdi:gas-station" style="font-size:15px;color:rgba(255,255,255,0.8);"></ha-icon> <span style="color:#34a853;">{{ states('sensor.you_jie_bei_jing_die0') or '-' }}</span></div>
  </div>
  <ul style="margin:0;padding-left:22px;color:rgba(255,255,255,0.92);font-size:13px;line-height:1.9;">
  <li>{{ next_date or '暂无下次调价信息' }}</li>
  <li>{% if trend == '上涨' %}<span style="color:#ea4335;">▲</span>{% elif trend == '下调' %}<span style="color:#34a853;">▼</span>{% else %}<span style="color:#fbbc05;">—</span>{% endif %} {{ tips or '暂无调价幅度信息' }}</li>
  </ul>
  </div>
